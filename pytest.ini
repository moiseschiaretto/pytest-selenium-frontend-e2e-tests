[pytest]
# Raiz do projeto no caminho de importação: permite "from src.pages.login.login_page import LoginPage" sem "../"
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    desktop_only: roda apenas no dispositivo desktop
    compact_only: roda apenas em smartphone, tablet e iPhone 17
    deslogado: o teste começa sem a sessão de login
# 4 testes em paralelo, relatório padrão (pytest-html) e dados do Allure a cada execução
addopts = --import-mode=importlib -n 4 --html=pytest-report/report.html --self-contained-html --alluredir=allure-results --clean-alluredir
